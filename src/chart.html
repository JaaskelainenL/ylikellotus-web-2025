<!DOCTYPE html>
<html class="inFinnish" lang="fi">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="./styles.css">
	<link rel="stylesheet" href="./lang.css">
	<title>Ylikellotus - tulokset</title>
</head>

<body class="overflow-x-hidden">
	<div class="absolute p-2">
		<a style="display: flex;" id="enButton" class="btn btn-primary btn-outline btn-xs md:btn-md" onclick="langEN()">🇺🇸</a>
		<a style="display: none;" id="fiButton" class="btn btn-primary btn-outline btn-xs md:btn-md" onclick="langFI()">🇫🇮</a>
	</div>
	<div>
		<div class="ufo-sky fixed h-screen w-svw -z-50"></div>
		<div class="ufo-sky-lower fixed h-screen w-svw -z-10"></div>
		<div class="ufo-sky-upper fixed h-screen w-svw -z-10"></div>
		<div class="ufo fixed h-screen w-svw -z-30"></div>
	</div>
	<main class="">
		<div class="ufo-sky-lower-upscreen fixed h-screen w-svw -z-10"></div>
		<section class="flex flex-col justify-center items-center z-50">
			<h2 class="font-airstrike text-white text-xl md:text-3xl font-bold lg:text-7xl 2xl:text-5xl z-100 my-16">
				<span lang="fi">Kellotustulokset</span>
				<span lang="en">Clocking results</span>
			</h2>

			<div class="mx-auto space-y-4 w-4/5 z-10 bg-gray-700/30 backdrop-blur-sm p-5 font-normal rounded-3xl border-gray-300 border overflow-y-scroll">
				<table class="table font-RobotoMono text-white font-normal lg:text-3xl">
					<thead class="font-normal lg:text-4xl text-white">
						<tr class="border-white">
							<th></th>
							<th>
								<span lang="fi">Nimi</span>
								<span lang="en">Name</span>
							</th>
							<th>
								<span lang="fi">Kilta</span>
								<span lang="en">Guild</span>
							</th>
							<th>
								<span lang="fi">Aika</span>
								<span lang="en">Time</span>
							</th>
						</tr>
					</thead>
					<tbody id="individual-results">
					</tbody>
				</table>
			</div>

			<h2 class="font-airstrike text-white text-xl md:text-3xl font-bold lg:text-7xl 2xl:text-5xl z-100 my-20">
				<span lang="fi">Parhaat killat</span>
				<span lang="en">Top guilds</span>
			</h2>

			<div class="mx-auto w-4/5 z-10 bg-gray-700/30 backdrop-blur-sm p-5 overflow-y-scroll font-normal rounded-3xl border border-gray-300 ">
				<table class="table font-RobotoMono text-white font-normal lg:text-3xl">
					<thead class="font-normal lg:text-4xl text-white">
						<tr class="border-white">
							<th>
								<span lang="fi">Kilta</span>
								<span lang="en">Guild</span>
							</th>
							<th>
								<span lang="fi">Kellottajat</span>
								<span lang="en">Participants</span>
							</th>
							<th>
								<span lang="fi">Keskiarvo</span>
								<span lang="en">Mean</span>
							</th>
							<th>
								<span lang="fi">Mediaani</span>
								<span lang="en">Median</span>
							</th>
						</tr>
					</thead>
					<tbody id="guild-results">
					</tbody>
				</table>

			</div>


			<a href="/" class="font-airstrike text-white text-2xl lg:text-3xl 2xl:text-3xl mt-64 pb-32 hover:underline">
				<span lang="fi">Takaisin etusivulle</span>
				<span lang="en">Front page</span>
			</a>

		</section>
	</main>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
	<script src="background.js"></script>

	<script src="chart.js"></script>
	<script src="lang.js"></script>
</body>

</html>
