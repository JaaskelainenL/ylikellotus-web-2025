<!DOCTYPE html>
<html class="inFinnish" lang="fi">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="./styles.css">
	<link rel="stylesheet" href="./lang.css">
	<title>Ylikellotus - supersalainen admin näkymä</title>
</head>

<body class="overflow-x-hidden">
	<div>
		<div class="ufo-sky fixed h-screen w-svw -z-50"></div>
		<div class="ufo-sky-lower fixed h-screen w-svw z-10"></div>
		<div class="ufo-sky-upper fixed h-screen w-svw -z-10"></div>
		<div class="ufo fixed h-screen w-svw -z-30"></div>
	</div>
	<main class="">
		<div class="ufo-sky-lower-upscreen fixed h-screen w-svw z-10"></div>
		<section class="flex flex-col justify-center items-center z-50 pb-32 mb-64">
			<h2 class="font-airstrike text-white text-3xl font-bold lg:text-7xl 2xl:text-5xl z-100 my-32">
				<span lang="fi">Merkkaa kellotustulokset</span>
				<span lang="en">Mark the results</span>
			</h2>

			<div class="my-10 bg-black text-red-700 px-5 py-5 rounded-md">
				<p>Käyttäjänimi: admin</p>
				<p>Salasana: Ylikellotus2025</p>
				<p><strong>Poista ennen liveen menoa!</strong></p>
			</div>

			<div class="my-10">
				<button class="btn text-white text-2xl font-RobotoMono" onclick="setAuth()">Autentikoi</button>
			</div>

			<div class="flex mx-auto flex-col space-y-4 w-4/5">
				<div
					class="flex flex-wrap text-white text-3xl font-RobotoMono w-full justify-between text-center md:flex-nowrap pb-32 gap-5">
					<input type="text" placeholder="Nimi" id="name" class="p-2">
					<input type="text" placeholder="Kilta" id="guild" class="p-2">
					<input type="number" placeholder="Aika (s)" id="time" class="p-2">
					<button onclick="postScores()" class="btn font-RobotoMono text-2xl">Lähetä</button>
				</div>

				<div class="mx-auto space-y-4 w-4/5 z-10 bg-gray-700/30 backdrop-blur-sm p-5 font-normal rounded-3xl overflow-y-scroll">
					<table class="table font-RobotoMono text-white font-normal lg:text-3xl">
						<thead class="font-normal lg:text-4xl text-white">
							<tr class="border-white">
								<th>

								</th>
								<th>
									<span lang="fi">Nimi</span>
									<span lang="en">Name</span>
								</th>
								<th>
									<span lang="fi">Kilta</span>
									<span lang="en">Guild</span>
								</th>
								<th>
									<span lang="fi">Aika</span>
									<span lang="en">Time</span>
								</th>
							</tr>
						</thead>
						<tbody id="results">
							<tr class="border-white">
								<th><button>Poista</button></th>
								<th>${d.name}</th>
								<th>${d.total}</th>
								<th>${d.average/1000} s</th>
								<th>${d.median/1000} s</th>
							</tr>   
						</tbody>
					</table>
				</div>


		</section>
	</main>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>

	<script src="chart-admin.js"></script>
	<script src="lang.js"></script>
</body>

</html>
